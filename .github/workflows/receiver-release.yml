name: Release Duo Receiver
run-name: Duo Receiver release from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional failed release run ID: resume its exact notarization candidate'
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: receiver-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Belweave/DuoTrackpad' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 60
    environment: receiver-release
    permissions:
      contents: write
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      DUO_RELEASE_DIR: ${{ github.workspace }}/build/distribution
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release ref and version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/check-toolchain.sh
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          VERSION="$(python3 -c 'import json; print(json.load(open("release/receiver.json"))["version"])')"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then [[ "$GITHUB_REF_NAME" == "v$VERSION" ]]; fi
          bash scripts/verify-release-ref.sh "$VERSION" "$GITHUB_SHA"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'This release already exists. Bump release/receiver.json; released assets are immutable.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate resume source
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DUO_RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          [[ "$DUO_RESUME_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DUO_RESUME_RUN" > "$RUNNER_TEMP/duo-resume-run.json"
          python3 - "$RUNNER_TEMP/duo-resume-run.json" <<'PY'
          import json,os,sys
          run=json.load(open(sys.argv[1]))
          assert run['head_sha']==os.environ['GITHUB_SHA'], 'Resume must use the same commit'
          assert run['path']=='.github/workflows/receiver-release.yml', 'Not a release run'
          assert run['event'] in ('push','workflow_dispatch'), 'Untrusted run event'
          assert run['repository']['full_name']==os.environ['GITHUB_REPOSITORY'], 'Wrong repository'
          PY
      - name: Download prior candidate
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: receiver-resume-${{ github.sha }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: build/resume
      - name: Restore exact submitted archives
        if: inputs.resume_run_id != ''
        run: python3 scripts/ci-resume.py restore "$DUO_RELEASE_DIR" build/resume/receiver-resume.tar.gz
      - name: Run release checks
        run: bash scripts/ci.sh
      - name: Install disk image tools
        run: |
          python3 -m venv build/release-venv
          build/release-venv/bin/pip install -r release/requirements.txt
      - name: Import release credentials
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/ci-import-signing.sh
      - name: Build, sign, notarize, and verify DMG
        run: bash scripts/release-macos.sh
      - name: Publish verified binary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/verify-release.py dmg "$DUO_RELEASE_DIR/DuoReceiver-$VERSION-arm64.dmg" release
          bash scripts/verify-release-ref.sh "$VERSION" "$GITHUB_SHA"
          gh release create "v$VERSION" \
            "$DUO_RELEASE_DIR/DuoReceiver-$VERSION-arm64.dmg" \
            "$DUO_RELEASE_DIR/SHA256SUMS" \
            --target "$GITHUB_SHA" --title "Duo Receiver v$VERSION" \
            --notes-file release/notes.md --prerelease
      - name: Preserve candidate for interrupted notarization
        if: always()
        run: |
          mkdir -p build
          python3 scripts/ci-resume.py save "$DUO_RELEASE_DIR" build/receiver-resume.tar.gz
      - name: Save resumable candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receiver-resume-${{ github.sha }}
          path: build/receiver-resume.tar.gz
          if-no-files-found: ignore
          retention-days: 30
      - name: Save notarization receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: receiver-notarization-${{ github.run_id }}
          path: |
            build/distribution/notary/
            build/distribution/build.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        run: bash scripts/ci-cleanup-signing.sh
